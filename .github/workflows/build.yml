# BUILD, TEST AND RELEASE.
#
#   windows  openxr-sim.exe (the runtime inside it) with MSVC, then the end-to-end test on the runner's
#            own Direct3D -- WARP, Windows' software adapter, the first and only one there: D3D11 and D3D12,
#            each alone and with every layer type, the eyes' pixels checked as tests/sim-test.sh checks
#            them. For a tag, the tested .exe becomes the release's download.
#   linux    a .deb for each distribution, built in that distribution's own container so it links that
#            system's libraries (CMakeLists.txt, "a .deb"): Ubuntu 24.04, Ubuntu 26.04, Debian 13. One deb
#            for all cannot be: their library versions differ (jsoncpp is libjsoncpp25 on 24.04, 26 after).
#            Each is installed with apt and the installed copy checked: one frame and its layout, the
#            runtime's export, the manifest naming it. The end-to-end chain on each was run in VMs (docs/NOTES.md).
#   release  for a tag, once both have passed: both downloads on the tag's release, made if it is not there.
#
# A release for a tag pushed before this file existed: Actions > build > Run workflow, with the tag. The
# checker is here rather than in tests/ so that such a tag's own tree need not contain it.
#
# The headers are Khronos's, at the versions LOS builds against (forge/recipes/openxr-sdk, vulkan-headers);
# neither loader is linked (README.md, "Building").
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release this tag (for example v0.8.0); empty builds and tests the branch only"
        required: false
        default: ""

permissions:
  contents: read

env:
  OPENXR_SDK_REF: release-1.1.65
  VULKAN_HEADERS_REF: v1.4.367
  # The tag being released: the one pushed, or the one asked for; empty for a branch.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          path: src
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenXR-SDK
          ref: ${{ env.OPENXR_SDK_REF }}
          path: openxr-sdk
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_REF }}
          path: vulkan-headers

      # Configure and build in one step: vcvars64's environment does not outlive the step that set it.
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          where ninja >nul 2>nul || pip install ninja || exit /b 1
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DOPENXR_SIM_OPENXR_INCLUDE=%CD%\openxr-sdk\include -DOPENXR_SIM_VULKAN_INCLUDE=%CD%\vulkan-headers\include || exit /b 1
          cmake --build build || exit /b 1

      - name: Test on Direct3D (WARP)
        timeout-minutes: 5
        shell: python
        run: |
          import os, subprocess, sys, time
          build = os.path.abspath("build")
          out = os.path.abspath("test-output")
          failures = 0

          def pixel(path, x, y):
              data = open(path, "rb").read()
              parts = data.split(b"\n", 3)
              w, h = map(int, parts[1].split())
              o = len(data) - w * h * 3 + (y * w + x) * 3
              return tuple(data[o:o + 3])

          def expect(what, path, x, y, want, near=0):
              global failures
              try:
                  got = pixel(path, x, y)
              except Exception as e:
                  got = str(e)
              ok = isinstance(got, tuple) and all(abs(a - b) <= near for a, b in zip(got, want))
              print(f"  {what:<50} {'ok' if ok else f'FAILED ({got}, wanted {want})'}")
              failures += not ok

          # tests/sim-test.sh's checks: the eyes are 256 square, the blue square 64 at the top left.
          def eyes(d):
              expect("left eye: red", f"{d}/left.ppm", 200, 200, (255, 0, 0))
              expect("left eye: blue square top left", f"{d}/left.ppm", 10, 10, (0, 0, 255))
              expect("right eye: green", f"{d}/right.ppm", 200, 200, (0, 255, 0))
              expect("right eye: blue square top left", f"{d}/right.ppm", 10, 10, (0, 0, 255))
              expect("right eye: no square bottom left", f"{d}/right.ppm", 10, 240, (0, 255, 0))

          # And its layers(): where each layer lands after the head turn.
          def layers(d):
              L, R = f"{d}/left.ppm", f"{d}/right.ppm"
              expect("quad A: yellow, both eyes", L, 148, 148, (255, 255, 0))
              expect("quad A: yellow in the right eye too", R, 148, 148, (255, 255, 0))
              expect("quad A: its blue square top left", L, 108, 108, (0, 0, 255))
              expect("quad A: not mirrored (top right)", L, 148, 108, (255, 255, 0))
              expect("quad A: not flipped (bottom left)", L, 108, 148, (255, 255, 0))
              expect("cylinder: magenta, left eye", L, 128, 90, (255, 0, 255))
              expect("cylinder: its blue at its left", L, 96, 90, (0, 0, 255))
              expect("cylinder: not in the right eye", R, 128, 90, (0, 255, 0))
              expect("equirect: cyan, right eye", R, 140, 205, (0, 255, 255))
              expect("equirect: its blue top left", R, 100, 185, (0, 0, 255))
              expect("equirect: not in the left eye", L, 140, 205, (255, 0, 0))
              expect("quad B: its opaque blue square", L, 45, 192, (0, 0, 255))
              expect("quad B: half white over red", L, 70, 192, (255, 188, 188), near=2)
              expect("quad B: half white over green", R, 70, 192, (188, 255, 188), near=2)

          def run(name, args):
              global failures
              d = os.path.join(out, name)
              os.makedirs(d, exist_ok=True)
              print(f"== {name}", flush=True)
              env = dict(os.environ, OPENXR_SIM_DEVICE="sim", OPENXR_SIM_HEADLESS=d, OPENXR_SIM_LOG="1")
              try:
                  r = subprocess.run([os.path.join(build, "openxr-sim-client.exe")] + args, env=env, timeout=60,
                                     stdin=subprocess.DEVNULL, capture_output=True, text=True)
                  sys.stdout.write(r.stdout)
                  sys.stdout.write("".join("  " + l for l in r.stderr.splitlines(True)))
                  if r.returncode != 0:
                      print(f"  the client exited {r.returncode}")
                      failures += 1
              except subprocess.TimeoutExpired:
                  print("  the client took over 60 s")
                  failures += 1
              # The simulator outlives the session by as long as it takes to write; its summary comes last.
              summary = os.path.join(d, "summary")
              for _ in range(100):
                  if os.path.exists(summary):
                      break
                  time.sleep(0.1)
              if os.path.exists(summary):
                  text = open(summary).read()
                  print("  the simulator: " + text.strip())
                  failures += "layout faults 0" not in text
              else:
                  print("  the simulator wrote no summary")
                  failures += 1
              eyes(d)
              if "--layers" in args:
                  layers(d)

          for api in ("d3d11", "d3d12"):
              run(api, [f"--{api}"])
              run(f"{api}-layers", [f"--{api}", "--layers"])
          print(f"{failures} failed")
          sys.exit(1 if failures else 0)

      - name: Keep the test's pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: test-output
          if-no-files-found: ignore

      - name: Name the download
        shell: pwsh
        run: |
          $version = if ($env:TAG) { $env:TAG -replace '^v', '' } else { "${{ github.sha }}".Substring(0, 7) }
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "dist/openxr-sim-$version-windows-x64.exe"
          Copy-Item build/openxr-sim.exe $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $exe -Leaf)" | Out-File -Encoding ascii "$exe.sha256"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: openxr-sim-windows-x64
          path: dist

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu24.04
            image: ubuntu:24.04
            cc: gcc-14          # 24.04's default GCC is 13; std::println needs 14
            cxx: g++-14
          - distro: ubuntu26.04
            image: ubuntu:26.04
            cc: gcc
            cxx: g++
          - distro: debian13
            image: debian:13
            cc: gcc
            cxx: g++
    container: ${{ matrix.image }}
    steps:
      - name: Packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build pkg-config \
            ${{ matrix.cc }} ${{ matrix.cxx }} libfontconfig-dev libdbus-1-dev libwayland-dev libxkbcommon-dev \
            libgl-dev libjsoncpp-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            dpkg-dev file binutils
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          path: src
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/OpenXR-SDK
          ref: ${{ env.OPENXR_SDK_REF }}
          path: openxr-sdk
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: ${{ env.VULKAN_HEADERS_REF }}
          path: vulkan-headers
      # GLFW bundled: 3.4 is needed and not every one of these has it. /usr: the paths the runtime and its
      # manifest name are fixed here, and the package installs there.
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=/usr \
            -DOPENXR_SIM_BUNDLED_GLFW=ON \
            -DOPENXR_SIM_OPENXR_INCLUDE=$PWD/openxr-sdk/include -DOPENXR_SIM_VULKAN_INCLUDE=$PWD/vulkan-headers/include
          cmake --build build
      # The Debian revision names the distribution: 0.8.1-1~debian13. "~" sorts before anything, so a
      # distribution's own later packaging of the same version would win.
      - name: Package
        run: |
          (cd build && cpack -D CPACK_DEBIAN_PACKAGE_RELEASE=1~${{ matrix.distro }})
          mkdir -p dist && mv build/*.deb dist/
          (cd dist && sha256sum *.deb > "$(ls *.deb).sha256")
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb
      # The INSTALLED copy, as a user gets it: apt resolves what dpkg-shlibdeps named. A font, as any desktop
      # has; the container has none.
      - name: Install and check
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y ./dist/*.deb fonts-dejavu-core
          lib=/usr/lib/x86_64-linux-gnu/openxr-sim/libopenxr_sim.so
          test -f "$lib"
          nm -D --defined-only "$lib" | grep -q ' xrNegotiateLoaderRuntimeInterface$'
          grep -q "\"$lib\"" /usr/share/openxr/1/openxr_sim.json
          test -f /usr/share/applications/openxr-sim.desktop
          openxr-sim --screenshot "$RUNNER_TEMP/frame.png" --size 640x400
          test -s "$RUNNER_TEMP/frame.png"
          openxr-sim --layout-check
      - uses: actions/upload-artifact@v4
        with:
          name: openxr-sim-linux-${{ matrix.distro }}
          path: dist

  release:
    needs: [windows, linux]
    if: needs.windows.result == 'success' && needs.linux.result == 'success' && (github.event_name == 'workflow_dispatch' && inputs.tag != '' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the release; nothing else is written
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: openxr-sim-*   # the downloads, not the test's pictures
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          ls -l dist
          cat > notes.md <<EOF
          **Windows**: \`openxr-sim-$version-windows-x64.exe\` -- the runtime is inside it. Run it and choose
          "Make this the active runtime"; Windows asks an administrator to allow installing it in Program Files.
          Settings > Apps removes it again, and "Go back to ..." restores the runtime it replaced.

          **Linux**: the .deb for your system --

          | | |
          |---|---|
          | Ubuntu 24.04 | \`openxr-sim_$version-1~ubuntu24.04_amd64.deb\` |
          | Ubuntu 26.04 | \`openxr-sim_$version-1~ubuntu26.04_amd64.deb\` |
          | Debian 13 | \`openxr-sim_$version-1~debian13_amd64.deb\` |

          \`sudo apt install ./<that file>\`, then run openxr-sim and choose "Make this the active runtime" (for
          you alone; no rights asked). Elsewhere, build from source (README.md, "Building").

          EOF
          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body >> notes.md
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Already there (a re-run, or made before this job's files were these): its files and notes
            # become this run's, and a download this run did not make is taken off.
            for a in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
              [ -e "dist/$a" ] || gh release delete-asset "$TAG" "$a" --repo "$REPO" --yes
            done
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --title "openxr-sim $version" \
              --notes-file notes.md
          fi
